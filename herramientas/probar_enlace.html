<!doctype html>
<html lang="es"><meta charset="utf-8"><title>Prueba enlace.js</title>
<body style="font-family:system-ui;padding:1rem">
<h1>Prueba de enlace.js</h1>
<label>Fecha (UTC) <input id="f" type="datetime-local" value="2026-11-14T12:00"></label>
<select id="p"><option>marte</option><option>iss</option><option>luna</option><option>luna_polo_sur</option></select>
<button id="b">Calcular</button>
<pre id="o"></pre>
<script type="module">
  import { getEnlace, formatearDuracion } from '../src/motor/enlace.js';
  const run = () => {
    const iso = document.getElementById('f').value + ':00Z';
    try {
      const e = getEnlace(iso, document.getElementById('p').value);
      document.getElementById('o').textContent =
        `Ida: ${formatearDuracion(e.owlt_s)} · Ida y vuelta: ${formatearDuracion(e.rtt_s)}\n` + JSON.stringify(e, null, 2);
    } catch (err) { document.getElementById('o').textContent = 'ERROR: ' + err.message; }
  };
  document.getElementById('b').onclick = run; run();
</script>
</body></html>
