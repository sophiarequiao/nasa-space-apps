<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba autoridad.js · SOSpesAI</title>
<style>
  body{font-family:system-ui;max-width:760px;margin:auto;padding:1rem}
  select,input{font-size:1rem;padding:.35rem;margin:.2rem 0}
  label{display:block;margin:.4rem 0}
  #quien{font-size:2rem;font-weight:700;margin:.2rem 0}
  .TIERRA{color:#1d4ed8}.COMPARTIDA{color:#b45309}.TRIPULACION{color:#b91c1c}
  table{border-collapse:collapse;width:100%} td,th{border-bottom:1px solid #ddd;padding:.3rem;text-align:left}
  small{color:#555}
</style>
<body>
<h1>Prueba de autoridad.js</h1>
<label>Perfil de misión <select id="perfil"></select></label>
<label>Condición <select id="cond"></select></label>
<label>Fecha y hora (UTC) <input id="fecha" type="datetime-local"></label>

<svg id="dial" viewBox="0 0 320 180" width="320" role="img" aria-label="Dial de autoridad">
  <!-- Tres zonas en escala logarítmica de A: 0,01 … 0,25 … 1 … 100 -->
  <path id="zT" fill="none" stroke="#1d4ed8" stroke-width="22"/>
  <path id="zC" fill="none" stroke="#b45309" stroke-width="22"/>
  <path id="zR" fill="none" stroke="#b91c1c" stroke-width="22"/>
  <line id="aguja" x1="160" y1="160" x2="160" y2="40" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <circle cx="160" cy="160" r="7" fill="#111"/>
  <text x="22" y="176" font-size="11">TIERRA</text><text x="128" y="16" font-size="11">COMPARTIDA</text><text x="232" y="176" font-size="11">TRIPULACIÓN</text>
</svg>
<p id="quien"></p>
<p id="exp"></p>
<p id="exp_en"><small></small></p>
<table id="tabla"></table>
<p id="perfilInfo"><small></small></p>

<script type="module">
import { calcularAutoridad, listarPerfiles, listarCondiciones } from '../src/motor/autoridad.js';
const $ = (id) => document.getElementById(id);
$('perfil').innerHTML = listarPerfiles().map(p => `<option value="${p.id}">${p.nombre}</option>`).join('');
$('cond').innerHTML = listarCondiciones().map(c => `<option value="${c.id}">${c.nombre} (T_crit ${c.t_crit_min} min)</option>`).join('');
$('cond').value = 'renal_colic';
$('fecha').value = new Date().toISOString().slice(0, 16);

// Dial: ángulo de 180° (izquierda) a 0° (derecha) según log10(A) entre 0,01 y 100
const LMIN = -2, LMAX = 2;
const ang = (A) => Math.PI * (1 - (Math.min(LMAX, Math.max(LMIN, Math.log10(Math.max(A, 1e-6)))) - LMIN) / (LMAX - LMIN));
const pt = (a, r) => [160 + r * Math.cos(a), 160 - r * Math.sin(a)];
const arco = (A1, A2) => { const [x1, y1] = pt(ang(A1), 120), [x2, y2] = pt(ang(A2), 120); return `M${x1} ${y1} A120 120 0 0 1 ${x2} ${y2}`; };
$('zT').setAttribute('d', arco(0.01, 0.25)); $('zC').setAttribute('d', arco(0.25, 1)); $('zR').setAttribute('d', arco(1, 100));

function pintar() {
  try {
    const r = calcularAutoridad({ perfil: $('perfil').value, fechaISO: $('fecha').value + ':00Z', condicion: $('cond').value });
    const [x, y] = pt(ang(r.A), 105); $('aguja').setAttribute('x2', x); $('aguja').setAttribute('y2', y);
    $('quien').className = r.quienDecide; $('quien').textContent = `${r.quienDecide}  ·  A = ${String(r.A).replace('.', ',')}`;
    $('exp').textContent = r.explicacion; $('exp_en').firstChild.textContent = r.explicacion_en;
    const d = r.desglose_min;
    $('tabla').innerHTML = `<tr><th>T_tierra (min)</th><th>${r.t_tierra_min}</th></tr>
      <tr><td>Espera hasta tener enlace</td><td>${d.espera}</td></tr>
      <tr><td>Envío del resumen (${r.paquete_kB} kB a ${r.tasa_medica_kbps} kbps)</td><td>${d.envio}</td></tr>
      <tr><td>Luz, ida y vuelta</td><td>${d.luz_ida_y_vuelta}</td></tr>
      <tr><td>Respuesta en Tierra (SUPUESTO)</td><td>${d.respuesta_tierra}</td></tr>
      <tr><th>T_crit (min)</th><th>${r.t_crit_min} ${r.condicion.estado ? '(' + r.condicion.estado + ')' : ''}</th></tr>
      <tr><td>Ayuda posible de la Tierra</td><td>${r.modo}${r.guiaEnDirecto ? ' · guía en directo posible' : ''}</td></tr>`;
    $('perfilInfo').firstChild.textContent = `Evacuación: ${r.perfil.evacuacion} · Gravedad: ${r.perfil.gravedad_g} g · ${r.perfil.cortes}`;
  } catch (err) { $('quien').className = ''; $('quien').textContent = 'ERROR'; $('exp').textContent = err.message; }
}
for (const id of ['perfil', 'cond', 'fecha']) $(id).oninput = pintar;
pintar();
</script>
</body></html>
